<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>OBS Decklist</title>
  <style>
    body { background: transparent; margin: 0; padding: 0; }
    #dlRoot {
      display: inline-block;
      --size-legend: 130px;      --gap-legend: 12px;
      --size-champion: 130px;    --gap-champion: 12px;
      --size-main: 72px;         --gap-main: 6px;
      --size-battlefield: 72px;  --gap-battlefield: 6px;
      --size-rune: 72px;         --gap-rune: 6px;
    }

    .dl-wrap {
      display: flex;
      align-items: flex-start;
      gap: 18px;
      animation: dlIn .4s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    @keyframes dlIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Colonna sinistra: Legend + Champion (interlinea = margine sotto ogni tile) ── */
    .dl-left-col {
      display: flex; flex-direction: column;
      flex-shrink: 0;
    }
    .dl-tile-legend   { margin-bottom: var(--gap-legend); }
    .dl-tile-champion { margin-bottom: var(--gap-champion); }

    /* ── Colonna destra: Main list + (Battlefields / Rune) ── */
    .dl-right-col {
      display: flex; flex-direction: column; gap: 14px;
    }
    .dl-main-grid {
      display: flex; flex-wrap: wrap; align-content: flex-start;
      gap: var(--gap-main);
      width: 480px;
    }
    .dl-bottom-row { display: flex; gap: 24px; }
    .dl-bf-group   { display: flex; flex-wrap: wrap; gap: var(--gap-battlefield); }
    .dl-rune-group { display: flex; flex-wrap: wrap; gap: var(--gap-rune); }

    /* ── Tile generico (nessun crop: l'immagine mantiene le proporzioni native) ── */
    .dl-tile { position: relative; display: block; }
    .dl-tile img {
      display: block;
      filter: drop-shadow(0 3px 10px rgba(0,0,0,0.6));
    }
    .dl-tile-placeholder {
      display: block;
      border-radius: 8px;
      aspect-ratio: 5 / 7;
      background: rgba(20,20,26,0.55);
      border: 1px solid rgba(255,255,255,0.12);
    }

    .dl-tile-legend img, .dl-tile-legend .dl-tile-placeholder { width: var(--size-legend); }
    .dl-tile-champion img, .dl-tile-champion .dl-tile-placeholder { width: var(--size-champion); }
    .dl-tile-main img, .dl-tile-main .dl-tile-placeholder { width: var(--size-main); }
    .dl-tile-battlefield img, .dl-tile-battlefield .dl-tile-placeholder { width: var(--size-battlefield); }
    .dl-tile-rune img, .dl-tile-rune .dl-tile-placeholder { width: var(--size-rune); }

    .dl-qty {
      position: absolute; right: 2px; bottom: 2px;
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 12px; font-weight: 800;
      color: #000; background: #e8c84a;
      border-radius: 999px; padding: 1px 6px;
      line-height: 1.4;
      box-shadow: 0 1px 4px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>
<div id="dlRoot"></div>
<script type="module" src="/js/obs-decklist.js"></script>
</body>
</html>
